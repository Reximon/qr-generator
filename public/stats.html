<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #F5F1E8;
      color: #2C1810;
      padding: 2rem;
    }
    h1 { font-family: 'Caveat', cursive; font-size: 2rem; text-align: center; margin-bottom: 1rem; }
    .card { background: #FFF8E7; border: 2px solid #2C1810; border-radius: 4px; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #ddd; font-size: 0.85rem; }
    th { font-weight: 700; color: #8B7355; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; }
    .empty { text-align: center; color: #8B7355; padding: 2rem; font-style: italic; }
    footer { text-align: center; margin-top: 2rem; font-family: 'Caveat', cursive; font-size: 1rem; color: #8B7355; }
  </style>
</head>
<body>
  <h1>QR Stats</h1>
  <div class="card">
    <p id="total"></p>
    <table id="stats-table">
      <thead>
        <tr><th>Código</th><th>Visitas</th><th>Creado</th><th>URL destino</th></tr>
      </thead>
      <tbody id="stats-body"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No hay códigos QR registrados</div>
  </div>
  <footer>Hecho con ♥ y código</footer>
  <script>
    fetch('/api/stats')
      .then(r => r.json())
      .then(data => {
        document.getElementById('total').textContent = 'Total QR: ' + data.total;
        const tbody = document.getElementById('stats-body');
        const empty = document.getElementById('empty');
        if (data.qrCodes.length === 0) { empty.style.display = 'block'; }
        else {
          data.qrCodes.forEach(q => {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + q.code + '</td><td>' + q.visits + '</td><td>' + new Date(q.createdAt).toLocaleDateString() + '</td><td><a href="' + q.url + '">' + q.url + '</a></td>';
            tbody.appendChild(tr);
          });
        }
      });
  </script>
</body>
</html>
