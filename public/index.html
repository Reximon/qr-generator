<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Generator</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --accent: #2563eb;
      --border: #ddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a2e;
        --card: #16213e;
        --text: #e0e0e0;
        --accent: #60a5fa;
        --border: #333;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      background: var(--bg);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover { opacity: 0.85; }
    .download-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .download-btn:hover { opacity: 0.85; }
    #qr-container { margin-top: 1.5rem; }
    img { max-width: 100%; border-radius: 8px; }
    #error { color: #ef4444; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QR Generator</h1>
    <input type="text" id="text" placeholder="Escribe un texto o URL" />
    <button id="generate">Generar QR</button>
    <div id="error"></div>
    <div id="qr-container"></div>
  </div>
  <script>
    const input = document.getElementById("text");
    const btn = document.getElementById("generate");
    const container = document.getElementById("qr-container");
    const error = document.getElementById("error");

    function ensureUrl(text) {
      if (text.startsWith("http://") || text.startsWith("https://")) {
          return text;
        }
        return "https://" + text;
    }

    btn.addEventListener("click", async () => {
      let text = input.value.trim();
      text = ensureUrl(text);

      if (!text) return;
      error.textContent = "";
      container.innerHTML = "<p>Cargando...</p>";
      try {
        const res = await fetch(`/api/qr?text=${encodeURIComponent(text)}`);
        if (!res.ok) throw new Error("Error al generar QR");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        container.innerHTML = `<img src="${url}" alt="QR Code" /><br /><a href="${url}" download="qr.png" class="download-btn">Descargar QR</a>`;
      } catch (e) {
        error.textContent = e.message;
        container.innerHTML = "";
      }
    });
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") btn.click();
    });
  </script>
</body>
</html>
